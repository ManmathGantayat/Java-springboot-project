server.port=8084
management.endpoints.web.exposure.include=*

# ===============================
# DATABASE CONFIG (RDS MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:database-1.csdikyqqsv0r.us-east-1.rds.amazonaws.com}:3306/datastore?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:admin}
spring.datasource.password=${MYSQL_PASSWORD:aws123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# DB INIT (DISABLED – RDS SAFE)
# ===============================
spring.datasource.initialization-mode=never
spring.sql.init.mode=never

# ===============================
# LOGGING
# ===============================
logging.file.name=${LOG_FILE_PATH:/var/log/app/datastore.log}

# ===============================
# ACTUATOR + CLOUDWATCH
# ===============================
management.metrics.export.cloudwatch.namespace=datastoreapp
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.step=1m
management.metrics.export.cloudwatch.region=us-east-1

logging.level.io.micrometer=INFO
logging.level.software.amazon.awssdk=WARN
