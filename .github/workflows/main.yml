name: Full CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Java 17
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3️⃣ Build Spring Boot JAR
    - name: Build JAR
      working-directory: backend
      run: mvn clean package -DskipTests

    # 4️⃣ Cleanup old deployment on EC2 (SAFE)
    - name: Cleanup old deployment
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          rm -rf /home/ec2-user/app
          mkdir -p /home/ec2-user/app
          chmod 755 /home/ec2-user/app

    # 5️⃣ Upload JAR to EC2 (FILE, NOT DIRECTORY)
    - name: Upload JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: backend/target/datastore-0.0.7.jar
        target: /home/ec2-user/app/datastore-0.0.7.jar

    # 6️⃣ Stop old application (FIRST DEPLOY SAFE)
    - name: Stop Old Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          pkill -f datastore-0.0.7.jar || true

    # 7️⃣ Start new application
    - name: Start Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          chmod +x /home/ec2-user/app/datastore-0.0.7.jar

          nohup java -jar /home/ec2-user/app/datastore-0.0.7.jar \
          --server.port=8084 \
          > /var/log/app.log 2>&1 &

          sleep 5
          ps -ef | grep datastore || true
          echo "🚀 Application started"
