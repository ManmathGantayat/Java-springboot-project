name: Full CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Java 17
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3️⃣ Build JAR
    - name: Build Spring Boot JAR
      working-directory: backend
      run: mvn clean package -DskipTests

    # 4️⃣ Prepare EC2 directory
    - name: Prepare EC2 directory
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          rm -rf /home/ec2-user/app
          mkdir -p /home/ec2-user/app
          mkdir -p /var/log

    # 5️⃣ Upload JAR (directory only)
    - name: Upload JAR
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: backend/target/datastore-0.0.7.jar
        target: /home/ec2-user/app/

    # 6️⃣ Stop old application (NO SIGNALS)
    - name: Stop Old Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          PID=$(ps -ef | grep datastore-0.0.7.jar | grep -v grep | awk '{print $2}')
          if [ -n "$PID" ]; then
            echo "Stopping PID $PID"
            kill $PID
            sleep 3
          else
            echo "No running application"
          fi
          exit 0

    # 7️⃣ Start application
    - name: Start Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd /home/ec2-user/app
          file datastore-0.0.7.jar

          nohup java -jar datastore-0.0.7.jar \
          --server.port=8084 \
          > /var/log/app.log 2>&1 &

          sleep 5
          ps -ef | grep datastore || true
          ss -lntp | grep 8084 || true
          echo "🚀 Application started successfully"
