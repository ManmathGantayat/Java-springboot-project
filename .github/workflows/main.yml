name: Full CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Java 17
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3️⃣ Build Spring Boot JAR
    - name: Build JAR
      run: mvn clean package -DskipTests
      working-directory: backend

    # 4️⃣ Cleanup old files on EC2 (SAFE)
    - name: Cleanup old deployment
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          mkdir -p /home/ec2-user/app
          rm -f /home/ec2-user/app/datastore-0.0.7.jar || true
          rm -rf /home/ec2-user/app/backend || true

    # 5️⃣ Upload JAR to EC2 (FLATTENED PATH ✅)
    - name: Upload JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: backend/target/datastore-0.0.7.jar
        target: /home/ec2-user/app/datastore-0.0.7.jar

    # 6️⃣ Stop old application (FIRST DEPLOY SAFE)
    - name: Stop Old Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          PID=$(pgrep -f datastore-0.0.7.jar || true)
          if [ -n "$PID" ]; then
            echo "Stopping application PID: $PID"
            kill -9 $PID || true
          else
            echo "No existing application running"
          fi

    # 7️⃣ Start new application
    - name: Start Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          mkdir -p /var/log/app
          chmod 777 /var/log/app

          nohup env \
          MYSQL_HOST=${{ secrets.MYSQL_HOST }} \
          MYSQL_PORT=${{ secrets.MYSQL_PORT }} \
          MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }} \
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          java -jar /home/ec2-user/app/datastore-0.0.7.jar \
          --server.port=8084 \
          > /var/log/app/app.log 2>&1 &

          echo "🚀 Application started successfully"
