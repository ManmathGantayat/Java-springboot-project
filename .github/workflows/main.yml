name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3️⃣ Build Spring Boot JAR
      - name: Build Spring Boot JAR
        working-directory: backend
        run: mvn clean package -DskipTests

      # 4️⃣ Prepare EC2 directories (SAFE)
      - name: Prepare EC2 directories
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ec2-user/app
            mkdir -p /home/ec2-user/logs
            chmod -R 755 /home/ec2-user
            exit 0

      # 5️⃣ Upload JAR to EC2
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: backend/target/datastore-0.0.7.jar
          target: /home/ec2-user/app/

      # 6️⃣ Stop old application (NEVER FAILS)
      - name: Stop old application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Stopping old application if running..."

            PID=$(pgrep -f datastore-0.0.7.jar || true)

            if [ -n "$PID" ]; then
              echo "Found PID: $PID"
              kill -9 $PID || true
            else
              echo "No running application found"
            fi

            echo "Stop step completed safely"
            exit 0

      # 7️⃣ Start application
      - name: Start application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app

            nohup java -jar datastore-0.0.7.jar \
              --server.port=8084 \
              > /home/ec2-user/logs/datastore.log 2>&1 &

            sleep 5

            echo "Running process:"
            ps -ef | grep datastore | grep -v grep || true

            echo "Listening ports:"
            ss -lntp | grep 8084 || true

            echo "🚀 Deployment completed successfully"
            exit 0
