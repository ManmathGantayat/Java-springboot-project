name: Full CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Java 17
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    # 3️⃣ Build Spring Boot JAR (skip tests)
    - name: Build Spring Boot JAR
      working-directory: backend
      run: mvn clean package -DskipTests

    # 4️⃣ Prepare EC2 directory
    - name: Prepare EC2 directory
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          mkdir -p /home/ec2-user/app
          mkdir -p /home/ec2-user/logs
          rm -f /home/ec2-user/app/datastore-0.0.7.jar

    # 5️⃣ Upload JAR (CORRECT WAY)
    - name: Upload JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: backend/target/datastore-0.0.7.jar
        target: /home/ec2-user/app/
        overwrite: true

    # 6️⃣ Stop old application (SAFE)
    - name: Stop old application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          PID=$(pgrep -f datastore-0.0.7.jar || true)
          if [ -n "$PID" ]; then
            kill $PID
            sleep 3
          fi

    # 7️⃣ Start new application
    - name: Start application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          nohup java \
            -jar /home/ec2-user/app/datastore-0.0.7.jar \
            --server.port=8084 \
            > /home/ec2-user/logs/app.log 2>&1 &

          sleep 5
          ps -ef | grep datastore || true
          ss -lntp | grep 8084 || true
