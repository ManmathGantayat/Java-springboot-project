name: Full CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Java
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3️⃣ Build JAR
    - name: Build JAR
      run: mvn clean package -DskipTests
      working-directory: backend

    # 4️⃣ Remove old JAR on EC2
    - name: Cleanup old JAR
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          rm -f /home/ec2-user/app/datastore-0.0.7.jar

    # 5️⃣ Upload new JAR
    - name: Upload JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: backend/target/datastore-0.0.7.jar
        target: /home/ec2-user/app/
        overwrite: true

    # 6️⃣ Stop existing app
    - name: Stop Old Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          PID=$(pgrep -f datastore-0.0.7.jar || true)
          if [ -n "$PID" ]; then
            kill -9 $PID
          fi

    # 7️⃣ Start new app
    - name: Start Application
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          mkdir -p /var/log/app
          chmod 777 /var/log/app

          nohup env \
          MYSQL_HOST=${{ secrets.MYSQL_HOST }} \
          MYSQL_PORT=${{ secrets.MYSQL_PORT }} \
          MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }} \
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          java -jar /home/ec2-user/app/datastore-0.0.7.jar \
          --server.port=8084 \
          > /var/log/app/app.log 2>&1 &
